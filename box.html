<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Box Model Card</title>
    <link rel="stylesheet" href="./template.css">
    <link rel="stylesheet" href="./box.css">
  </head>
  <body>
    <h1>Box Model Card</h1>

    <!-- Change landscape to portrait or square
     for a different size card -->
    <div class="card landscape">
      <div class="card-front">
        <section class="background">
          <section class="title">
            <h1 class="title">Style Soup</h1>
            <h2 class="title">Keep our jewelry out of the trash!</h2>
          </section>
          <section class="bodyleft">
            <h1 class="follow">FOLLOW US!</h1>
            <p>Facebook: Style Soup</p>
            <p>Insta: @stylesoup.insta</p>
            <p>TikTok: @stylesoup.tiktok</p>
          </section>
          <section class="bodyright">
            <img class="brooch" src="./images/brooch.jpeg" height="100px" />
          </section>
        </section>
      </div>
      <div class="card-back">
        <section class="background">
          <section class="bracelet">
            <img class="bracelet" src="./images/beaded-bracelet.jpeg" height="100px" />
          </section>
          <footer>
            <h1 class="contact">Contact us!</h1>
          <section class="whole">
            <h3 class="contact">contact.stylesoup@gmail.com</h3>
            <h3 class="contact">(774) 670-8835</h3>
          </section>
        </section>
      </div>
    </div>

    <p>Explain your layout approach here...</p>

    <footer>
      <small>
        <a href="index.html">All cards</a> |
        <a href="citations.html">Sources &amp; Citations</a>
      </small>
    </footer>

    <script src="./script.js"></script>
  </body>
</html>
