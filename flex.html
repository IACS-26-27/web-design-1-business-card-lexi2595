<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flexbox Card</title>
    <link rel="stylesheet" href="./template.css">
    <link rel="stylesheet" href="./flex.css">
  </head>
  <body>
    <h1>Flexbox Card</h1>

    <!-- Change landscape to portrait or square
     for a different size card -->
    <div class="card landscape">
      <div class="card-front">
        <section class="title">
          <h1 class="title"><b>Style Soup</b></h1>
          <h2 class="title">Keep our jewelry out of the trash!</h2>
        </section>
        <section class="description">
          <p class="description">Facebook: Style Soup
            <br>
            Instagram: @stylesoup.insta
            <br>
            TikTok: @stylesoup.tiktok
          </p>
        </section>
        <section class="contact">
          <p class="footer">contact.stylesoup@gmail.com</p>
        </section>
      </div>
      <div class="card-back">
        <section class="image">
          <img class="bracelet" src="./images/beaded-bracelet.jpeg" width="200px" />
        </section>
      </div>
    </div>

    <!-- Honors: add this button to switch your card between
     landscape, portrait, and square:

</html>
